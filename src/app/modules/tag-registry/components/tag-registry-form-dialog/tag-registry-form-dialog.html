<p-dialog
  [visible]="open()"
  (visibleChange)="onVisibleChange($event)"
  [header]="title()"
  closeAriaLabel="Close"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [dismissableMask]="!submitting()"
  [style]="{ width: '440px', maxWidth: 'calc(100vw - 2rem)' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="flex flex-col gap-1.5">
      <label for="epc" class="text-sm font-medium text-heading">EPC</label>
      <input
        pInputText
        id="epc"
        class="w-full ds-num"
        formControlName="epc"
        autocomplete="off"
        spellcheck="false"
        autocapitalize="characters"
        placeholder="E280 6894 0000 4012 AB"
        [invalid]="epcInvalid()"
        [attr.aria-invalid]="epcInvalid() || null"
        aria-describedby="epc-hint epc-error"
      />
      @if (epcInvalid()) {
        <small id="epc-error" class="flex items-center gap-1.5 text-xs text-muted-destructive-foreground" role="alert">
          <i class="pi pi-exclamation-circle text-xs" aria-hidden="true"></i>{{ epcErrorText() }}
        </small>
      } @else if (preview()) {
        <small id="epc-hint" class="text-xs text-muted">
          Stored as <span class="font-medium text-heading ds-num">{{ preview() }}</span>
        </small>
      } @else {
        <small id="epc-hint" class="text-xs text-muted">Usually 24 hexadecimal characters (0-9, A-F).</small>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="label" class="text-sm font-medium text-heading">
        Label <span class="font-normal text-muted">optional</span>
      </label>
      <input
        pInputText
        id="label"
        class="w-full"
        formControlName="label"
        autocomplete="off"
        placeholder="Tool tray A"
        aria-describedby="label-hint"
      />
      <small id="label-hint" class="text-xs text-muted">A human name so staff recognize the tag.</small>
    </div>

    @if (serverError()) {
      <p-message severity="error" icon="pi pi-times-circle" styleClass="ds-message">
        <span>{{ serverError() }}</span>
      </p-message>
    }
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="submitting()"
      (onClick)="cancel()"
    />
    <p-button [label]="submitLabel()" [loading]="submitting()" (onClick)="submit()" />
  </ng-template>
</p-dialog>
