<p-dialog
  [visible]="open()"
  (visibleChange)="onVisibleChange($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting()"
  [dismissableMask]="!submitting()"
  [style]="{ width: '30rem', maxWidth: 'calc(100vw - 2rem)' }"
>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label class="field__label" for="epc">EPC</label>
      <input
        pInputText
        id="epc"
        class="u-mono"
        formControlName="epc"
        autocomplete="off"
        spellcheck="false"
        autocapitalize="characters"
        placeholder="E280 6894 0000 4012 AB"
        [attr.aria-invalid]="epcInvalid() || null"
        aria-describedby="epc-hint epc-error"
      />
      @if (epcInvalid()) {
        <p id="epc-error" class="field__error" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>{{ epcErrorText() }}
        </p>
      } @else if (preview()) {
        <p id="epc-hint" class="field__hint">
          Stored as <span class="u-mono field__preview">{{ preview() }}</span>
        </p>
      } @else {
        <p id="epc-hint" class="field__hint">Usually 24 hexadecimal characters (0-9, A-F).</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="label">Label <span class="field__opt">optional</span></label>
      <input
        pInputText
        id="label"
        formControlName="label"
        autocomplete="off"
        placeholder="Tool tray A"
        aria-describedby="label-hint"
      />
      <p id="label-hint" class="field__hint">A human name so staff recognize the tag.</p>
    </div>

    @if (serverError()) {
      <p class="form__error" role="alert">
        <i class="pi pi-times-circle" aria-hidden="true"></i>{{ serverError() }}
      </p>
    }
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="submitting()"
      (onClick)="cancel()"
    />
    <p-button
      [label]="submitLabel()"
      icon="pi pi-check"
      [loading]="submitting()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
