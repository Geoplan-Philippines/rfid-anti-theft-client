<section class="login" aria-labelledby="login-title">
  <div class="login__brand">
    <span class="login__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path
          d="M12 2.5l7 2.6v5.2c0 4.4-2.9 8.2-7 9.2-4.1-1-7-4.8-7-9.2V5.1l7-2.6z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="10" r="2.1" stroke="currentColor" stroke-width="1.7" />
        <path d="M12 12.1v3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    </span>
    <p class="login__product">MUJI EAS</p>
  </div>

  <header>
    <h1 id="login-title" class="login__title">Sign in</h1>
    <p class="login__sub">Use your store account to open the console.</p>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        spellcheck="false"
        autocapitalize="none"
        [attr.aria-invalid]="emailInvalid() || null"
        [attr.aria-describedby]="emailInvalid() ? 'email-error' : null"
      />
      @if (emailInvalid()) {
        <p id="email-error" class="field__error" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          {{ emailError() }}
        </p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="passwordInvalid() || null"
        [attr.aria-describedby]="passwordInvalid() ? 'password-error' : null"
      />
      @if (passwordInvalid()) {
        <p id="password-error" class="field__error" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          Password is required.
        </p>
      }
    </div>

    @if (errorMsg()) {
      <p class="form__error" role="alert">
        <i class="pi pi-times-circle" aria-hidden="true"></i>
        {{ errorMsg() }}
      </p>
    }

    <button type="submit" class="login__submit" [disabled]="submitting()" [attr.aria-busy]="submitting()">
      {{ submitting() ? 'Signing in' : 'Sign in' }}
    </button>
  </form>
</section>
