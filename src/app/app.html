<div class="shell" [class.shell--bare]="!showChrome()">
  @if (showChrome()) {
    <app-header class="sticky top-0 z-20" />
  }

  <div class="shell-body">
    @if (showChrome()) {
      <app-sidebar class="z-10" />
    }

    <main class="shell-main" id="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="top-right" />
