<a class="skip-link" href="#main">Skip to content</a>

<div class="shell" [class.shell--bare]="!showChrome()">
  @if (showChrome()) {
    <header class="topbar">
      <a class="brand" routerLink="/registry" aria-label="MUJI EAS, home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path
              d="M12 2.5l7 2.6v5.2c0 4.4-2.9 8.2-7 9.2-4.1-1-7-4.8-7-9.2V5.1l7-2.6z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="10" r="2.1" stroke="currentColor" stroke-width="1.7" />
            <path d="M12 12.1v3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand__name">MUJI <strong>EAS</strong></span>
      </a>
      <div class="topbar__end">
        @if (currentUser(); as user) {
          <span class="topbar__user">{{ user.email }}</span>
        }
        <span class="topbar__env u-mono">MUJI EAS</span>
        <button type="button" class="topbar__logout" (click)="logout()">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          Log out
        </button>
      </div>
    </header>
  }

  <div class="body">
    @if (showChrome()) {
      <nav class="sidenav" aria-label="Primary">
        <a
          class="navitem"
          routerLink="/registry"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <i class="pi pi-tags navitem__icon" aria-hidden="true"></i>
          <span>Tag Registry</span>
        </a>
        <a
          class="navitem"
          routerLink="/transactions"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <i class="pi pi-receipt navitem__icon" aria-hidden="true"></i>
          <span>Transactions</span>
        </a>
        <a
          class="navitem"
          routerLink="/events"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <i class="pi pi-bell navitem__icon" aria-hidden="true"></i>
          <span>Alarm Events</span>
        </a>
      </nav>
    }

    <main class="content" id="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="top-right" />
<p-confirmdialog />
